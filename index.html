<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zbieracz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            const $cont = $(".container");
            const $player = $(".player");
            const playerStandAnim = "sprites/player_stand.png";
            const playerRunAnim = "sprites/player_run.gif";

            let playerSpeed = 10;   
            let playerPositionX = parseFloat($player.css("margin-left"));
            let playerPositionY = parseFloat($player.css("margin-top"));
            
            let clickedKeys = {};
            let isStanding = false;    
            let facingDirection = 0; //0 - prawo, 1 - lewo

            let playerPoints = 0;

            function randomCoinPosition(){
                let positionX = Math.floor(Math.random() * ($cont.width() - $coin.width()));
                let positionY = Math.floor(Math.random() * ($cont.height() - $coin.height()));
                $coin.css({
                    "margin-left":positionX,
                    "margin-top":positionY
                })
            }
            function checkColision(obj1, obj2){
                let obj1X = parseFloat(obj1.css("margin-left"));
                let obj1Y = parseFloat(obj1.css("margin-top"));
                let obj2X = parseFloat(obj2.css("margin-left"));
                let obj2Y = parseFloat(obj2.css("margin-top"));

                if(obj1X < obj2X + obj2.width() &&
                   obj1X + obj1.width() > obj2X &&
                   obj1Y < obj2Y + obj2.height() &&
                   obj1Y + obj1.height() > obj2Y){
                    return true;
                }
                return false;
            }


            //FUNKCJE POCZĄTKOWE
            const $coin = $("<img>").addClass("coin").attr("src","sprites/coin.gif");
            $cont.append($coin);
            randomCoinPosition();

            $("#points").text(`Punkty: ${playerPoints}`);
            
            

            $(document).on("keydown", function(event){
                clickedKeys[event.key.toLowerCase()] = true;//ZAPISUJEMY WCISNIETY KLAWISZ
            })

            $(document).on("keyup", function(event){
                clickedKeys[event.key.toLowerCase()] = false;//USUWAMY WCISNIETY KLAWISZ
            })

            //GŁÓWNA FUNKCJA GRY
            function mainGame(){
                if((clickedKeys["w"] && clickedKeys["d"]) || 
                    (clickedKeys["d"] && clickedKeys["s"]) ||
                    (clickedKeys["s"] && clickedKeys["a"]) ||
                    (clickedKeys["a"] && clickedKeys["w"]))//SPRAWDZAMY CZY IDZIE NA UKOS
                {
                    //WZÓR W MATH NOTES
                    playerSpeed /= Math.sqrt(2);
                    isStanding = false;
                }else if((clickedKeys["w"] && clickedKeys["s"]) ||
                        (clickedKeys["a"] && clickedKeys["d"]))//SPRAWDZAMY CZY STOI W MIEJSCU KLIKAJĄC KLAWISZE DO SIEBIE PRZECIWNE
                {
                    isStanding = true;
                }else{
                    isStanding = false;
                }

                let leftBorder = 0 - $player.width()/2;
                let rightBorder = $cont.width() - $player.width()/2; //width() i height() ZWRACAJĄ LICZBE BEZ PX
                let topBorder = 0;
                let bottomBorder = $cont.height() - $player.height();

                //RUCH
                if(clickedKeys["a"] && playerPositionX - playerSpeed >= leftBorder){
                    facingDirection = 1;
                    playerPositionX -= playerSpeed;
                    $player.css("margin-left", playerPositionX);
                }
                if(clickedKeys["d"] && playerPositionX + playerSpeed <= rightBorder){
                    facingDirection = 0;
                    playerPositionX += playerSpeed;
                    $player.css("margin-left", playerPositionX);
                }
                if(clickedKeys["w"] && playerPositionY - playerSpeed >= topBorder){
                    playerPositionY -= playerSpeed;
                    $player.css("margin-top", playerPositionY);
                }
                if(clickedKeys["s"] && playerPositionY + playerSpeed <= bottomBorder){
                    playerPositionY += playerSpeed;
                    $player.css("margin-top", playerPositionY);
                }

                //STRONA W KTÓRĄ SIĘ PATRZY
                if(facingDirection == 1){
                    $player.css("transform", "scaleX(-1)"); 
                }else{
                    $player.css("transform", "scaleX(1)"); 
                }

                //ANIMACJE
                if((clickedKeys["a"] || clickedKeys["d"] || clickedKeys["w"] || clickedKeys["s"]) && !isStanding){
                    if($player.attr("src") == playerStandAnim){
                        $player.attr("src", playerRunAnim);
                    }
                }else{
                    $player.attr("src", playerStandAnim);
                }

                //RESETUJEMY SPEED
                playerSpeed = 10;
                
                if(checkColision($player, $coin)){
                    randomCoinPosition();
                    playerPoints++;
                    $("#points").text(`Punkty: ${playerPoints}`);
                }
            }

            setInterval(mainGame, 25);
        })
    </script>
</head>
<body>
    <p id="points"></p>
    <div class="container border">
        <img src="sprites/player_stand.png" class="player">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
