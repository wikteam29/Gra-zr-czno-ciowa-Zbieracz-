<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Zbieracz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $("#contents").hide();
            $("#mainTitle").hide().slideDown(5000, function(){
                $("#contents").show();
            });
            $(document).one("click", function(){//one SPRAWI ŻE CLICK WYKONA SIĘ TYLKO RAZ
                $("#mainTitle").stop(true, true).show()//1 true USUWA KOLEJKĘ, 
                                                //A 2 PRZERYWA ANIMACJE I CALLBACKUJE FUNKCJĘ
            })
            
            if(localStorage.getItem("numberOfResults") == null){
                localStorage.setItem("numberOfResults", 0);
            }
            let numberOfResults = Number(localStorage.getItem("numberOfResults"));
            let topResults = [];

            //WYPEŁNIAMY TABLICE WYNIKAMI
            for(let i=0;i<numberOfResults;i++){
                topResults[i] = Number(localStorage.getItem(`result${i+1}`));
            }

            //SORTUJEMY TABLICE
            for(let i=0;i<numberOfResults;i++){
                for(let j=0;j<numberOfResults;j++){
                    let smaller = topResults[j];

                    if(smaller < topResults[j+1]){
                        topResults[j] = topResults[j+1];
                        topResults[j+1] = smaller;
                    }else{
                        smaller = topResults[j+1];
                    }
                }
            }

            //USUWAMY NIEPOTRZEBNE DANE
            topResults.splice(5);

            localStorage.clear();
            localStorage.setItem("numberOfResults", topResults.length);

            for(let i=0;i<topResults.length;i++){
                localStorage.setItem(`result${i+1}`, topResults[i]);
            }

            //WYŚWIETLAMY TOPKE
            for(let i=0;i<topResults.length;i++){
                $("#resutlsTable").append(`<li>${topResults[i]}</li>`);
            }
        })
    </script>
</head>
<body class="menuBody">
    <div class="container-fluid">
        <div class="menu">
            <p id="mainTitle">ZBIERACZ</p>

            <div id="contents">
                <p>Zdobądź jak najwięcej monet przed końcem czasu, uważając na przeszkody</p>
                <a href="subpages/main_game.html"><button>START</button></a>
                <p>Top 5 wyników:</p>
                <ul id="resutlsTable">

                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
