<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zbieracz</title>
    <link rel="icon" href="../sprites/favi.ico" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../css/main.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function(){
            const $cont = $(".container");

            const $player = $("#player");
            const $playerSprite = $("#playerSprite");
            const $playerHitbox = $("#playerHitbox")

            const playerStandAnim = "../sprites/player_stand.png";
            const playerRunAnim = "../sprites/player_run.gif";
            const interval = 25;

            let playerSpeed = 10;   
            let playerPositionX = parseFloat($player.css("margin-left"));
            let playerPositionY = parseFloat($player.css("margin-top"));
            
            let clickedKeys = {};
            let isStanding = false;    
            let facingDirection = 0; //0 - prawo, 1 - lewo

            let playerPoints = 0;
            let timer = 120;
            let timeAccumulator = 0;
            let pause = false;

            let pointToNextObstacle = 5;

            let hitboxShowed = false;

            function randomObjectPosition(obj){
                let colision;

                do{
                    let positionX = Math.floor(Math.random() * ($cont.width() - obj.width()));
                    let positionY = Math.floor(Math.random() * ($cont.height() - obj.height()));

                    obj.css({
                        "margin-left":positionX,
                        "margin-top":positionY
                    });

                    colision = false;

                    //obj[0] PONIEWAŻ obj != $player NIGDY NIE ZADZIAŁA BO $() 
                    //TWORZY ZA KAŻDYM RAZEM NOWY OBIEKT a $()[0] BIERZE ELEMENT Z HTML
                    //PORÓWNUJEMY obj Z KAŻDYM OBIEKTEM NA MAPIE POZA SAMYYM SOBĄ
                    if(obj[0] != $player[0] && checkColision($player, obj)){
                        colision = true;
                    }
                    if(obj[0] != $coin[0] && checkColision($coin, obj)){
                        colision = true;
                    }
                    $(".rock").each(function(){
                        if(this != obj[0] && checkColision($(this), obj)){
                            colision = true;
                        }
                    });
                }while(colision);
            }

            function checkColision(obj1, obj2){
                let obj1X = parseFloat(obj1.css("margin-left")) + parseFloat(obj1.parent().css("margin-left"));
                let obj1Y = parseFloat(obj1.css("margin-top")) + parseFloat(obj1.parent().css("margin-top"));
                let obj2X = parseFloat(obj2.css("margin-left")) + parseFloat(obj2.parent().css("margin-left"));
                let obj2Y = parseFloat(obj2.css("margin-top")) + parseFloat(obj2.parent().css("margin-top"));

                //MATH NOTES
                if(obj1X < obj2X + obj2.width() &&
                   obj1X + obj1.width() > obj2X &&
                   obj1Y < obj2Y + obj2.height() &&
                   obj1Y + obj1.height() > obj2Y){
                    return true;
                }
                return false;
            }

            function addResult(result){
                let resultNumber = Number(localStorage.getItem("numberOfResults")) + 1;
                localStorage.setItem("numberOfResults", resultNumber);
                localStorage.setItem(`result${resultNumber}`, result);
            }

            function gameOver(deathMessage){
                clearInterval(game);

                addResult(playerPoints);
                sessionStorage.setItem("deathMessage", deathMessage);
                window.location.replace("../subpages/gameover_menu.html");//replace() BLOKUJE COFANIE SIE DO GRY Z EKRANU KOŃCOWEGO
            }

            function randomObstacle(){
                let r = Math.floor(Math.random() * 2);

                switch(r){
                    
                    case 0:
                        const $rock = $("<div>").addClass("rock");
                        const $rockSprite = $("<img>").attr("src", "../sprites/rock_obstacle.png");
                        const $rockHitbox = $("<div>").addClass("rockHitbox");
                        
                        let rockSize = Math.floor((Math.random() * 51) + 25);
                        $rock.width(rockSize).height(rockSize);
                        
                        $cont.append($rock);
                        $rock.append($rockSprite).append($rockHitbox);
                        randomObjectPosition($rock);

                        if(hitboxShowed){
                            showHitbox();
                        }
                        break;
                    case 1:
                        const $log = $("<div>").addClass("log");
                        const $logSprite = $("<img>").attr("src", "../sprites/log_obstacle.gif");
                        const $logHitbox = $("<div>").addClass("logHitbox");

                        let logSize = Math.floor((Math.random() * 51) + 75);
                        let logPositionX = 0;

                        //SZEROKOŚĆ JEST 3 RAZY MNIEJSZA NIŻ WYSOKOŚĆ
                        $log.width(logSize/3).height(logSize);

                        $log.css({
                            "margin-left":logPositionX,
                            "margin-top":Math.floor(Math.random() * ($cont.height() - $log.height()))
                        })

                        $cont.append($log);
                        $log.append($logSprite).append($logHitbox);

                        if(hitboxShowed){
                            showHitbox();
                        }

                        //PORUSZANIE SIĘ KŁODY DO KOŃCA MAPY
                        let logIntervalID = setInterval(function(){
                            if(!pause){
                                if(logPositionX < $cont.width() - $log.width()){
                                    logPositionX += 20;
                                    $log.css("margin-left",logPositionX);
                                }else{
                                    clearInterval(logIntervalID);
                                    $log.remove();
                                }
                            }
                        }, 50)
                        break;
                }
            }
            
            function togglePause(){
                pause = !pause;
                if(pause){
                    $playerSprite.attr("src", playerStandAnim);
                    $(".pauseMenu").show();
                }else{
                    $(".pauseMenu").hide();
                }
            }

            function showHitbox(){
                hitboxShowed = true;
                $(".playerHitbox, .coinHitbox, .rockHitbox, .logHitbox").addClass("border border-primary");
                $("#player, #coin, .rock, .log").addClass("border border-danger");
            }

            function hideHitbox(){
                hitboxShowed = false;
                $(".playerHitbox, .coinHitbox, .rockHitbox, .logHitbox").removeClass("border border-primary");
                $("#player, #coin, .rock, .log").removeClass("border border-danger");
            }


            //FUNKCJE POCZĄTKOWE (WYKONUJĄ SIĘ PO ROZPOCZĘCIU GRY)
            const $coin = $("<div id='coin'>");
            const $coinSprite = $("<img>").attr("src","../sprites/coin.gif");
            const $coinHitbox = $("<div>").addClass("coinHitbox");
            $cont.append($coin);
            $coin.append($coinSprite).append($coinHitbox);
            randomObjectPosition($coin);

            $("#points").text(playerPoints);
            $("#timer").text(timer);
            //
            

            $(document).on("keydown", function(event){
                clickedKeys[event.key.toLowerCase()] = true;//ZAPISUJEMY WCISNIETY KLAWISZ

                if(event.key.toLowerCase() == "p"){
                    togglePause();
                }else if(event.key.toLowerCase() == "h"){
                    if(!hitboxShowed){
                        showHitbox();
                    }else{
                        hideHitbox();
                    }
                }
            })

            $(document).on("keyup", function(event){
                clickedKeys[event.key.toLowerCase()] = false;//USUWAMY WCISNIETY KLAWISZ
            })

            $("#resumeBtn").click(togglePause);


            //GŁÓWNA FUNKCJA GRY
            function mainGame(){
                if(!pause){
                    if((clickedKeys["w"] && clickedKeys["d"]) || 
                        (clickedKeys["d"] && clickedKeys["s"]) ||
                        (clickedKeys["s"] && clickedKeys["a"]) ||
                        (clickedKeys["a"] && clickedKeys["w"]))//SPRAWDZAMY CZY IDZIE NA UKOS
                    {
                        //MATH NOTES
                        playerSpeed /= Math.sqrt(2);
                        isStanding = false;
                    }else if((clickedKeys["w"] && clickedKeys["s"]) ||
                            (clickedKeys["a"] && clickedKeys["d"]))//SPRAWDZAMY CZY STOI W MIEJSCU KLIKAJĄC KLAWISZE DO SIEBIE PRZECIWNE
                    {
                        isStanding = true;
                    }else{
                        isStanding = false;
                    }


                    let leftBorder = 0 - 19;
                    let rightBorder = $cont.width() - $player.width() + 19; //width() i height() ZWRACAJĄ LICZBE BEZ PX
                    let topBorder = 0 - 3;
                    let bottomBorder = $cont.height() - $player.height();

                    //RUCH
                    if(clickedKeys["a"]){
                        facingDirection = 1;
                        if(playerPositionX - playerSpeed >= leftBorder){
                            playerPositionX -= playerSpeed;
                        }else{
                            playerPositionX = leftBorder;
                        }
                        $player.css("margin-left", playerPositionX);
                    }
                    if(clickedKeys["d"]){
                        facingDirection = 0;
                        if(playerPositionX + playerSpeed <= rightBorder){
                            playerPositionX += playerSpeed;
                        }else{
                            playerPositionX = rightBorder;
                        }
                        $player.css("margin-left", playerPositionX);
                    }
                    if(clickedKeys["w"]){
                        if(playerPositionY - playerSpeed >= topBorder){
                            playerPositionY -= playerSpeed;
                        }else{
                            playerPositionY = topBorder;
                        }
                        $player.css("margin-top", playerPositionY);
                    }
                    if(clickedKeys["s"]){
                        if(playerPositionY + playerSpeed <= bottomBorder){
                            playerPositionY += playerSpeed;
                        }else{
                            playerPositionY = bottomBorder;
                        }
                        $player.css("margin-top", playerPositionY);
                    }

                    //STRONA W KTÓRĄ SIĘ PATRZY
                    if(facingDirection == 1){
                        $player.css("transform", "scaleX(-1)"); 
                    }else{
                        $player.css("transform", "scaleX(1)"); 
                    }

                    //ANIMACJE
                    if((clickedKeys["a"] || clickedKeys["d"] || clickedKeys["w"] || clickedKeys["s"]) && !isStanding){
                        if($playerSprite.attr("src") == playerStandAnim){
                            $playerSprite.attr("src", playerRunAnim);
                        }
                    }else{
                        $playerSprite.attr("src", playerStandAnim);
                    }

                    //RESETUJEMY SPEED
                    playerSpeed = 10;
                    
                    if(checkColision($playerHitbox, $coinHitbox)){
                        randomObjectPosition($coin);
                        playerPoints++;
                        pointToNextObstacle--;
                        $("#points").text(playerPoints);
                    }

                    if(pointToNextObstacle < 1){
                        pointToNextObstacle = 5;
                        randomObstacle();
                    }

                    //KOŃCE GRY
                    timeAccumulator += interval;
                    if(timeAccumulator >= 1000){
                        timeAccumulator = 0;
                        timer--;
                        $("#timer").text(timer);
                        if(timer <= 0){
                            gameOver("Koniec czasu");
                        }
                    }
                    $(".rock .rockHitbox").each(function(){
                        if(checkColision($playerHitbox, $(this))){
                            gameOver("Uderzyłeś w kamień");
                        }
                    })
                    $(".log .logHitbox").each(function(){
                        if(checkColision($playerHitbox, $(this))){
                            gameOver("Przygniotła cię kłoda");
                        }
                    })
                }
            }
            let game = setInterval(mainGame, interval);
        })
    </script>
</head>
<body>
    <div class="gameInfoContainer">
        <p class="m-0">Punkty: <span id="points"></span></p>
        <p class="m-0">Zostało <span id="timer"></span> sekund</span></p>
        <p id="pause" class="m-0">pauza(p)</p>
        <p id="hitbox" class="m-0">pokaż hitboxy(h)</p>
    </div>

    <div class="container mainGameContainer">
        <div id="player">
            <img src="../sprites/player_stand.png" id="playerSprite">
            <div class="playerHitbox" id="playerHitbox"></div>
        </div>
        
        <div class="pauseMenu menu pt-2">
            <a href="../main_menu.html"><button>MENU GŁÓWNE</button></a><br>
            <a href="main_game.html"><button>ZAGRAJ PONOWNIE</button></a><br>
            <button id="resumeBtn">WZNÓW</button><br>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
